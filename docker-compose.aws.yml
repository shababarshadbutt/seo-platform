# AWS deployment compose file — branch feature/aws-s3-sftp-deploy (from v1.46).
#
# Changes vs. the repo's existing docker-compose.yml:
#   - frontend/backend/worker run in production mode (next build + next start /
#     compiled backend start, not `next dev` / `npm run dev`) — v1.46 was a dev-mode
#     deployment; this is a shared, always-on production one.
#   - New SFTP_*, S3_*, CLOUDFRONT_* env vars for the Phase 1 pull-from-SFTP /
#     publish-to-S3 / invalidate-CloudFront feature. NO AWS access keys appear
#     anywhere here — the EC2 instance's IAM role supplies S3 + CloudFront
#     permissions. If IAM-role auth isn't wired up yet when this first deploys,
#     that's a blocker to fix, not a reason to add hardcoded keys.
#   - APP_VERSION has NO fallback default (unlike the repo's :-v1.48 pattern) —
#     on a shared production VM, silently deploying an unset/previous version by
#     omission is worse than a deploy failing loudly until .env is set correctly.
#   - BACKEND_URL / SEO_DESK_URL are now plain (non-NEXT_PUBLIC_) server-side env
#     vars. Under `next start`, NEXT_PUBLIC_* is inlined at BUILD time, not read
#     at runtime — baking a per-deployment URL into the distributed image is the
#     same drift risk this project already got burned by with APP_VERSION.
#     Frontend server code reads these normally at request time and hands them
#     to the client via a small runtime-config endpoint (see decision #1 below).
#   - Backend/worker now run a real compiled build (tsc -> dist), not `tsx`
#     (watch or otherwise) — decision #2 below.
#   - NODE_TLS_REJECT_UNAUTHORIZED now defaults to "1" (verify TLS) — the "0"
#     default was a corporate-proxy workaround for laptops; defaulting it off on
#     a production box means an unset .env silently ships with TLS verification
#     disabled. Override to "0" only if AWS DevOps confirms egress genuinely
#     needs it.
#   - Postgres and Redis no longer publish ports to the host — only backend/
#     worker/frontend containers need to reach them, over the internal compose
#     network (service DNS names), on a shared VM they have no reason to be
#     reachable from outside Docker at all.
#   - POSTGRES_PASSWORD is now required via .env, not hardcoded "sitemap".
#
# Claude CLI: treat the env var NAMES below as the contract for Phase 1's
# SFTP/S3/CloudFront code — read config using exactly these names so this file
# and the implementation stay in sync. Adjust values/comments as needed once
# real code lands, but don't rename the keys without updating this file too.

services:
  frontend:
    image: shababarshadbutt/sitemap-frontend:${APP_VERSION}
    build:
      context: ./frontend
      args:
        # The ONLY build-time value left: static per image, unlike the URLs
        # below which are read at runtime so one image works anywhere.
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Plain (non-public) — read server-side at request time, exposed to the
      # client bundle via a small runtime-config endpoint, not build-time inlining.
      BACKEND_URL: http://backend:3001
      # Required, no default. This is a link the BROWSER navigates to, so it
      # must be a browser-reachable address — the internal compose name
      # (http://seo-desk:3000) resolves only inside Docker and would 404 for
      # every user. Deliberately NOT proxied through this app: the link is a
      # full-page navigation, not a fetch, so the same-origin/CORS argument
      # that justified the /api/backend/* proxy does not apply, and SEO Desk
      # has its own NextAuth session whose callback URLs and cookie scoping a
      # path-prefix proxy would risk breaking for no benefit. SEO_DESK_PORT
      # stays published on the host for exactly this reason.
      SEO_DESK_URL: ${SEO_DESK_URL:?SEO_DESK_URL must be set to a browser-reachable address in .env}
      # Fine to bake at build time — this is genuinely static per image build,
      # unlike the two URLs above which can legitimately vary per deployment
      # target using the same image.
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION}
      # Same value again, but as a RUNTIME env var. /api/config prefers this over
      # the build-time copy above, so editing APP_VERSION in .env and recreating
      # the container updates the navbar pill without a rebuild — otherwise the
      # pill could report the version baked at build time while the image tag says
      # something else, which is the drift the pill exists to catch.
      APP_VERSION: ${APP_VERSION}
      # --- Phase 1 feature flag (default OFF) ---
      # Hides the SFTP source tab and the Publish-to-S3 button ENTIRELY (absent
      # from the DOM, not greyed out). Those two paths have never completed a
      # round trip against real AWS: the CloudFront public-path mapping is
      # unconfirmed and no live SFTP/S3 credentials have been exercised.
      # Everything else on this branch is verified, which is why only these two
      # are gated. Set to "true" only after the CloudFront mapping is confirmed
      # AND the throwaway-domain live test in docs/aws-deployment.md passes.
      # Must be on the frontend (hides the UI) AND the backend/worker (refuses
      # the endpoints) — one .env line feeds all three.
      AWS_PUBLISH_ENABLED: ${AWS_PUBLISH_ENABLED:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # RESOLVED: browser-side code no longer talks to the backend directly. Every
    # backend call goes to a RELATIVE /api/backend/* on this origin, which Next
    # reverse-proxies server-side to BACKEND_URL (see frontend/next.config.mjs).
    # That is why this is the only service publishing a port: one public entry
    # point, no CORS, and no public backend hostname/IP baked into the image.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  backend:
    image: shababarshadbutt/sitemap-backend:${APP_VERSION}
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: "3001"
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Corporate SSL-inspection proxy workaround (v1.39) — this VM is on AWS,
      # not behind that laptop-side proxy, so this almost certainly should be
      # "1" here. Left overridable rather than hardcoded off in case AWS
      # egress in your VPC does route through some inspecting proxy/NAT
      # appliance — confirm with DevOps, then set NODE_TLS_REJECT_UNAUTHORIZED=1
      # in .env once confirmed safe to do so.
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-1}"
      DATABASE_URL: postgresql://sitemap:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/sitemap_health
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /uploads
      EXPORT_DIR: /exports
      FRONTEND_URL: http://frontend:3000
      PDF_BACKEND_URL: http://localhost:3001
      CHROMIUM_PATH: /usr/bin/chromium-browser
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}

      # --- Phase 1: SFTP input (AWS Transfer Family) ---
      SFTP_HOST: ${SFTP_HOST:?SFTP_HOST must be set in .env}
      SFTP_PORT: ${SFTP_PORT:-22}
      SFTP_USERNAME: ${SFTP_USERNAME:?SFTP_USERNAME must be set in .env}
      # Prefer a private key over a password wherever Transfer Family supports it.
      # Password is an optional fallback: if SFTP_PRIVATE_KEY_PATH's file isn't
      # present, code falls back to SFTP_PASSWORD; require at least one set.
      SFTP_PRIVATE_KEY_PATH: ${SFTP_PRIVATE_KEY_PATH:-/run/secrets/sftp_private_key}
      SFTP_PASSWORD: ${SFTP_PASSWORD:-}
      SFTP_BASE_PATH: ${SFTP_BASE_PATH:-sftp-sitemaps-asapsmei}
      SFTP_MAX_CONCURRENT_CONNECTIONS: ${SFTP_MAX_CONCURRENT_CONNECTIONS:-4}

      # --- Phase 1 feature flag (default OFF) ---
      # With this false the SFTP and publish ENDPOINTS refuse with a 503 naming
      # the flag, so hiding the frontend controls is not the only thing gating an
      # unverified path — a hand-crafted request is refused too. See the frontend
      # service above for why these two features specifically are gated.
      AWS_PUBLISH_ENABLED: ${AWS_PUBLISH_ENABLED:-false}

      # --- Phase 1: S3 output (no access keys — IAM instance role only) ---
      S3_BUCKET: ${S3_BUCKET:-asap-cms-prod}
      # Where objects LIVE in the bucket. Independent of the public url below.
      S3_SITEMAPS_PREFIX_TEMPLATE: ${S3_SITEMAPS_PREFIX_TEMPLATE:-sites/{domain}/sitemaps/}
      # Where CloudFront SERVES them — what goes in the sitemap index's <loc>.
      # Set by the distribution, not by our uploader, so it is a SEPARATE knob:
      # if the real mapping differs from the bucket layout, change this line only.
      # Placeholders: {domain}, {file}. Must contain {file}.
      PUBLIC_SITEMAP_URL_TEMPLATE: ${PUBLIC_SITEMAP_URL_TEMPLATE:-https://{domain}/sitemaps/{file}}
      AWS_REGION: ${AWS_REGION:?AWS_REGION must be set in .env}
      # Publish never issues DeleteObject calls (explicit decision — removed
      # sitemap files become absent from the regenerated index, not deleted
      # from the bucket, since versioning is off and there's no undo).
      S3_PUBLISH_ALLOW_DELETE: "false"

      # --- Phase 1: CloudFront invalidation ---
      CLOUDFRONT_DISTRIBUTION_ID: ${CLOUDFRONT_DISTRIBUTION_ID:?CLOUDFRONT_DISTRIBUTION_ID must be set in .env}

      # --- Phase 1: per-domain publish lock (Redis-backed, TTL'd) ---
      PUBLISH_LOCK_TTL_SECONDS: ${PUBLISH_LOCK_TTL_SECONDS:-300}
    # No published port. The frontend reaches this over the internal compose
    # network (http://backend:3001) and proxies browser traffic to it; exposing
    # it publicly as well would defeat the single-entry-point design and put an
    # unauthenticated API on the open internet.
    volumes:
      - uploads:/uploads
      - exports:/exports
      # Mount the SFTP private key read-only if using key-based auth; omit if
      # Transfer Family is configured for a different auth method.
      - ${SFTP_PRIVATE_KEY_HOST_PATH:-./secrets/sftp_private_key}:/run/secrets/sftp_private_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  worker:
    image: shababarshadbutt/sitemap-backend:${APP_VERSION}
    build:
      context: ./backend
    command: npm run start:worker
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: "3002"
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-1}"
      DATABASE_URL: postgresql://sitemap:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/sitemap_health
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /uploads
      EXPORT_DIR: /exports

      # Same Phase 1 config as backend — the queued SFTP-pull / S3-publish jobs
      # (mirroring the existing >200-file redirect-fix job pattern) run here.
      SFTP_HOST: ${SFTP_HOST:?SFTP_HOST must be set in .env}
      SFTP_PORT: ${SFTP_PORT:-22}
      SFTP_USERNAME: ${SFTP_USERNAME:?SFTP_USERNAME must be set in .env}
      SFTP_PRIVATE_KEY_PATH: ${SFTP_PRIVATE_KEY_PATH:-/run/secrets/sftp_private_key}
      SFTP_PASSWORD: ${SFTP_PASSWORD:-}
      SFTP_BASE_PATH: ${SFTP_BASE_PATH:-sftp-sitemaps-asapsmei}
      SFTP_MAX_CONCURRENT_CONNECTIONS: ${SFTP_MAX_CONCURRENT_CONNECTIONS:-4}
      # Same flag as the backend: the worker runs the SFTP pull and the publish
      # jobs themselves, so it must agree or a job enqueued by an older process
      # would still execute.
      AWS_PUBLISH_ENABLED: ${AWS_PUBLISH_ENABLED:-false}
      S3_BUCKET: ${S3_BUCKET:-asap-cms-prod}
      # Storage layout vs. served path — two separate knobs; see the backend
      # service above. The worker is what actually writes the index, so this one
      # is the copy that decides the <loc> values in production.
      S3_SITEMAPS_PREFIX_TEMPLATE: ${S3_SITEMAPS_PREFIX_TEMPLATE:-sites/{domain}/sitemaps/}
      PUBLIC_SITEMAP_URL_TEMPLATE: ${PUBLIC_SITEMAP_URL_TEMPLATE:-https://{domain}/sitemaps/{file}}
      AWS_REGION: ${AWS_REGION:?AWS_REGION must be set in .env}
      S3_PUBLISH_ALLOW_DELETE: "false"
      CLOUDFRONT_DISTRIBUTION_ID: ${CLOUDFRONT_DISTRIBUTION_ID:?CLOUDFRONT_DISTRIBUTION_ID must be set in .env}
      PUBLISH_LOCK_TTL_SECONDS: ${PUBLISH_LOCK_TTL_SECONDS:-300}
    volumes:
      - uploads:/uploads
      - exports:/exports
      - ${SFTP_PRIVATE_KEY_HOST_PATH:-./secrets/sftp_private_key}:/run/secrets/sftp_private_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sitemap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: sitemap_health
    # No published port — only backend/worker (same compose network) need to
    # reach this. On a shared VM there's no reason for Postgres to be reachable
    # from outside Docker at all.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitemap -d sitemap_health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No published port — internal-only, same reasoning as Postgres above.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  seo-desk:
    build:
      context: ./apps/seo-desk
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/seo_desk
      NEXTAUTH_URL: http://localhost:${SEO_DESK_PORT:-4000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env}
      PYTHON_EXECUTABLE: python3
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set in .env}
    ports:
      - "${SEO_DESK_PORT:-4000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  uploads:
  exports:
  postgres_data:
  redis_data:
  mongo_data:
