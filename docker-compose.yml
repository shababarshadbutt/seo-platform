# DEV / LOCAL compose file. The DEPLOYED box uses docker-compose.aws.yml, and the
# two are NOT interchangeable — that file runs production builds, requires its
# variables rather than defaulting them, and is what every docs/deployment/
# runbook names. Bringing the shared VM up with THIS file is what produced the
# v1.63-Live outage: the frontend came up with no BACKEND_URL, so every
# /api/backend/* call answered 502, and with no AWS_PUBLISH_ENABLED, so the
# Cleaner's "From SFTP" tab silently disappeared.
#
# The env contract below is now kept deliberately in step with
# docker-compose.aws.yml. Only the defaults differ: this file must still work
# with no .env at all, so it uses :-fallbacks where that one uses :?hard-fails.
# If you add a variable the frontend, backend or worker reads at runtime, add it
# to BOTH files.
#
# APP_VERSION (.env, see .env.example) is the single source of truth for the
# released version: it tags every image AND is what the UI displays, so the
# navbar can never claim a version different from the images actually running.
# Bumping a release = editing that one line. The :-vX.YZ fallbacks only apply
# when .env is missing entirely; they are not a second place to maintain.
# Container log rotation, applied to every service below via *default-logging.
#
# Docker's default json-file driver has NO size cap, so a chatty service writes an
# unbounded log file that only ever gets smaller when the container is REPLACED (a
# rebuild-and-recreate deploy discards the old container's log with it). On a
# long-lived VM that is a steady upward drift in disk use with an occasional sharp
# drop at deploy time, and nothing in the app can clean it up because the files
# belong to the daemon, not the volume.
#
# 10MB x 3 files caps each service at 30MB and each volume-independent of the app's
# own cleanup. Raise max-file if you need longer history for debugging.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    logging: *default-logging
    image: shababarshadbutt/sitemap-frontend:${APP_VERSION:-v1.47}
    build:
      context: ./frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Plain (non-NEXT_PUBLIC_) server-side vars, read per request by
      # lib/runtime-config.ts. NEXT_PUBLIC_* is inlined at BUILD time and is NOT
      # read at runtime, so the NEXT_PUBLIC_BACKEND_URL / NEXT_PUBLIC_SEO_DESK_URL
      # that used to sit here had stopped doing anything at all — the frontend
      # they configured was reaching nothing.
      #
      # The compose SERVICE NAME, not localhost: these containers talk to each
      # other over the compose network, and BACKEND_PORT only publishes the
      # backend to the host.
      BACKEND_URL: http://backend:3001
      # A link the BROWSER navigates to, so it must be reachable from the user's
      # machine — never the internal http://seo-desk:3000.
      SEO_DESK_URL: ${SEO_DESK_URL:-http://localhost:4000}
      # Runtime copy, preferred over the build arg below so editing APP_VERSION in
      # .env and recreating the container updates the navbar pill with no rebuild.
      APP_VERSION: ${APP_VERSION:-v1.47}
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-v1.47}
      # Hides the Cleaner/Migration "From SFTP" tab and the Publish-to-S3 button
      # ENTIRELY (absent from the DOM, not greyed out). Off by default: those two
      # paths have never completed a round trip against real AWS. The same one
      # .env line must feed the backend and worker below, or the UI offers a
      # control the endpoints refuse with 503.
      AWS_PUBLISH_ENABLED: ${AWS_PUBLISH_ENABLED:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  backend:
    logging: *default-logging
    image: shababarshadbutt/sitemap-backend:${APP_VERSION:-v1.47}
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: "3001"
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Accept corporate SSL-inspection proxy certificates (v1.39). Defaults to
      # "0" (verification off) so sampling works behind such proxies; override
      # to "1" via the env if outbound TLS is not intercepted.
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-0}"
      DATABASE_URL: postgresql://sitemap:sitemap@postgres:5432/sitemap_health
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /uploads
      EXPORT_DIR: /exports
      DIAGNOSTICS_DIR: /diagnostics
      FRONTEND_URL: http://frontend:3000
      PDF_BACKEND_URL: http://localhost:3001
      CHROMIUM_PATH: /usr/bin/chromium-browser
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-insecure-encryption-key-change-me}
      # Same flag as the frontend. Checked independently here: /api/sftp/* and
      # /api/sessions/:id/publish* refuse with 503 naming the variable, so a
      # hand-crafted request cannot reach an unverified AWS path even when the
      # UI happens to be showing the control.
      AWS_PUBLISH_ENABLED: ${AWS_PUBLISH_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - uploads:/uploads
      - exports:/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    logging: *default-logging
    image: shababarshadbutt/sitemap-backend:${APP_VERSION:-v1.47}
    build:
      context: ./backend
    command: npm run worker
    environment:
      NODE_ENV: development
      WORKER_HEALTH_PORT: "3002"
      # Accept corporate SSL-inspection proxy certificates (v1.39). The worker
      # runs all outbound URL sampling, so this is the critical one — without it,
      # sampling behind such a proxy fails and every URL reports "No response".
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-0}"
      DATABASE_URL: postgresql://sitemap:sitemap@postgres:5432/sitemap_health
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /uploads
      EXPORT_DIR: /exports
      DIAGNOSTICS_DIR: /diagnostics
      # Same flag again. The SFTP-pull and S3-publish JOBS re-check it as they
      # start, so a job queued while it was on cannot still run after it is
      # turned off.
      AWS_PUBLISH_ENABLED: ${AWS_PUBLISH_ENABLED:-false}
    volumes:
      - uploads:/uploads
      - exports:/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    logging: *default-logging
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sitemap
      POSTGRES_PASSWORD: sitemap
      POSTGRES_DB: sitemap_health
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitemap -d sitemap_health"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # SEO Team Desk — separate Next.js + MongoDB app, linked from the sitemap
  # tool navbar (SEO_DESK_URL). Its own auth context (NextAuth).
  seo-desk:
    logging: *default-logging
    build:
      context: ./apps/seo-desk
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/seo_desk
      NEXTAUTH_URL: http://localhost:${SEO_DESK_PORT:-4000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-insecure-nextauth-secret-change-me}
      PYTHON_EXECUTABLE: python3
      CRON_SECRET: ${CRON_SECRET:-dev-insecure-cron-secret}
    ports:
      - "${SEO_DESK_PORT:-4000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    logging: *default-logging
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  exports:
  postgres_data:
  redis_data:
  mongo_data:
