services:
  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_URL: http://localhost:${BACKEND_PORT:-3001}
      NEXT_PUBLIC_SEO_DESK_URL: ${NEXT_PUBLIC_SEO_DESK_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: "3001"
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Accept corporate SSL-inspection proxy certificates (v1.39). Defaults to
      # "0" (verification off) so sampling works behind such proxies; override
      # to "1" via the env if outbound TLS is not intercepted.
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-0}"
      DATABASE_URL: postgresql://sitemap:sitemap@postgres:5432/sitemap_health
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /uploads
      EXPORT_DIR: /exports
      FRONTEND_URL: http://frontend:3000
      PDF_BACKEND_URL: http://localhost:3001
      CHROMIUM_PATH: /usr/bin/chromium-browser
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-insecure-encryption-key-change-me}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - uploads:/uploads
      - exports:/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ./backend
    command: npm run worker
    environment:
      NODE_ENV: development
      WORKER_HEALTH_PORT: "3002"
      # Accept corporate SSL-inspection proxy certificates (v1.39). The worker
      # runs all outbound URL sampling, so this is the critical one — without it,
      # sampling behind such a proxy fails and every URL reports "No response".
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-0}"
      DATABASE_URL: postgresql://sitemap:sitemap@postgres:5432/sitemap_health
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /uploads
      EXPORT_DIR: /exports
    volumes:
      - uploads:/uploads
      - exports:/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sitemap
      POSTGRES_PASSWORD: sitemap
      POSTGRES_DB: sitemap_health
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitemap -d sitemap_health"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # SEO Team Desk — separate Next.js + MongoDB app, linked from the sitemap
  # tool navbar (NEXT_PUBLIC_SEO_DESK_URL). Its own auth context (NextAuth).
  seo-desk:
    build:
      context: ./apps/seo-desk
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/seo_desk
      NEXTAUTH_URL: http://localhost:${SEO_DESK_PORT:-4000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-insecure-nextauth-secret-change-me}
      PYTHON_EXECUTABLE: python3
      CRON_SECRET: ${CRON_SECRET:-dev-insecure-cron-secret}
    ports:
      - "${SEO_DESK_PORT:-4000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  exports:
  postgres_data:
  redis_data:
  mongo_data:
