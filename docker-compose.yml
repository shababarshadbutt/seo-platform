# APP_VERSION (.env, see .env.example) is the single source of truth for the
# released version: it tags every image AND is what the UI displays, so the
# navbar can never claim a version different from the images actually running.
# Bumping a release = editing that one line. The :-vX.YZ fallbacks only apply
# when .env is missing entirely; they are not a second place to maintain.

# Cap every container's log file. Without this the json-file driver grows
# without bound, and CLEANER_TRACE=1 (which emits ~2 debug lines per file) can
# fill the disk during a single large diagnostic run.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  frontend:
    logging: *default-logging
    image: shababarshadbutt/sitemap-frontend:${APP_VERSION:-v1.52}
    build:
      context: ./frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_URL: http://localhost:${BACKEND_PORT:-3001}
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-v1.52}
      NEXT_PUBLIC_SEO_DESK_URL: ${NEXT_PUBLIC_SEO_DESK_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  backend:
    image: shababarshadbutt/sitemap-backend:${APP_VERSION:-v1.52}
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: "3001"
      # Backend only. The Sitemap Cleaner's cross-file dedup map holds one entry
      # per unique URL for the whole run (~130 bytes each), so the ceiling is a
      # direct function of corpus size: a real 1,605-file / 4.3 GB / ~35M-URL
      # corpus aborted the API at 4096 with `FATAL ERROR: Reached heap limit`.
      # That abort is uncatchable, so no error frame reaches the browser and the
      # UI just freezes. The worker deliberately keeps the image default (4096
      # from the Dockerfile) — it never runs a clean, and handing it 12 GB it
      # cannot use would only over-commit the host.
      NODE_OPTIONS: "--max-old-space-size=${BACKEND_HEAP_MB:-12288}"
      # Accept corporate SSL-inspection proxy certificates (v1.39). Defaults to
      # "0" (verification off) so sampling works behind such proxies; override
      # to "1" via the env if outbound TLS is not intercepted.
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-0}"
      DATABASE_URL: postgresql://sitemap:sitemap@postgres:5432/sitemap_health
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /uploads
      EXPORT_DIR: /exports
      FRONTEND_URL: http://frontend:3000
      PDF_BACKEND_URL: http://localhost:3001
      CHROMIUM_PATH: /usr/bin/chromium-browser
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-insecure-encryption-key-change-me}
      # Sitemap Cleaner (v1.50). Runs in THIS process — see .env.example for
      # what each one does. Parallelism defaults match v1.49 deliberately.
      CLEANER_PARALLEL_THRESHOLD: "${CLEANER_PARALLEL_THRESHOLD:-200}"
      CLEANER_MAX_WORKERS: "${CLEANER_MAX_WORKERS:-4}"
      CLEANER_ABANDON_GRACE_MINUTES: "${CLEANER_ABANDON_GRACE_MINUTES:-5}"
      CLEANER_PENDING_UPLOAD_TIMEOUT_SECONDS: "${CLEANER_PENDING_UPLOAD_TIMEOUT_SECONDS:-120}"
      CLEANER_REQUEST_TIMEOUT_MINUTES: "${CLEANER_REQUEST_TIMEOUT_MINUTES:-30}"
      CLEANER_RUN_MAX_AGE_HOURS: "${CLEANER_RUN_MAX_AGE_HOURS:-6}"
      CLEANER_TRACE: "${CLEANER_TRACE:-0}"
      CLEANER_HEARTBEAT_SECONDS: "${CLEANER_HEARTBEAT_SECONDS:-30}"
      CLEANER_UPLOAD_BATCH_SIZE: "${CLEANER_UPLOAD_BATCH_SIZE:-50}"
      CLEANER_MAX_FILES_PER_RUN: "${CLEANER_MAX_FILES_PER_RUN:-20000}"
    logging: *default-logging
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - uploads:/uploads
      - exports:/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: shababarshadbutt/sitemap-backend:${APP_VERSION:-v1.52}
    build:
      context: ./backend
    command: npm run worker
    environment:
      NODE_ENV: development
      WORKER_HEALTH_PORT: "3002"
      # Accept corporate SSL-inspection proxy certificates (v1.39). The worker
      # runs all outbound URL sampling, so this is the critical one — without it,
      # sampling behind such a proxy fails and every URL reports "No response".
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-0}"
      DATABASE_URL: postgresql://sitemap:sitemap@postgres:5432/sitemap_health
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /uploads
      EXPORT_DIR: /exports
      # The age-based sweep of abandoned cleaner run directories piggybacks on
      # the ZIP-cleanup job, which runs in THIS process — so the worker needs
      # the max-age even though it never runs a clean itself.
      CLEANER_RUN_MAX_AGE_HOURS: "${CLEANER_RUN_MAX_AGE_HOURS:-6}"
    logging: *default-logging
    volumes:
      - uploads:/uploads
      - exports:/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    logging: *default-logging
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sitemap
      POSTGRES_PASSWORD: sitemap
      POSTGRES_DB: sitemap_health
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitemap -d sitemap_health"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # SEO Team Desk — separate Next.js + MongoDB app, linked from the sitemap
  # tool navbar (NEXT_PUBLIC_SEO_DESK_URL). Its own auth context (NextAuth).
  seo-desk:
    logging: *default-logging
    build:
      context: ./apps/seo-desk
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/seo_desk
      NEXTAUTH_URL: http://localhost:${SEO_DESK_PORT:-4000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-insecure-nextauth-secret-change-me}
      PYTHON_EXECUTABLE: python3
      CRON_SECRET: ${CRON_SECRET:-dev-insecure-cron-secret}
    ports:
      - "${SEO_DESK_PORT:-4000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    logging: *default-logging
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  exports:
  postgres_data:
  redis_data:
  mongo_data:
